<aside>安全与数据泄露：条件是非技术用户部署面向公众的应用。成本失控：条件是长会话、多智能体、修复循环。模型供应中断：条件是并购或竞争关系变化，已发生两次。三个结构性矛盾：模型商品化与接入依赖并存；生成能力快于验证能力；面向非专业用户扩张与该群体缺乏验收能力并存。</aside>
